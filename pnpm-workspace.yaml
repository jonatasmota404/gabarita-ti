  - '@node-rs/argon2-darwin-arm64@2.2.2'
  - '@node-rs/argon2-darwin-x64@2.2.2'
  - '@node-rs/argon2-freebsd-x64@2.2.2'
  - '@node-rs/argon2-linux-arm-gnueabihf@2.2.2'
  - '@node-rs/argon2-linux-arm64-gnu@2.2.2'
  - '@node-rs/argon2-linux-arm64-musl@2.2.2'
  - '@node-rs/argon2-linux-x64-gnu@2.2.2'
  - '@node-rs/argon2-linux-x64-musl@2.2.2'
  - '@node-rs/argon2-win32-arm64-msvc@2.2.2'
  - '@node-rs/argon2-win32-ia32-msvc@2.2.2'
  - '@node-rs/argon2-win32-x64-msvc@2.2.2'
  - '@node-rs/argon2@2.2.2'
